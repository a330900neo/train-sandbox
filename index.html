<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-top">
        <div class="toolbar">
            <button id="btn-pan" class="active">Pan/Zoom</button>
            <button id="btn-build-track">Build Track</button>
            <button id="btn-build-plat">Build Platform</button>
            <button id="btn-select">Select</button>
            <button id="btn-multi">Multi-Select</button>
        </div>
        <div class="toolbar">
            <label><input type="checkbox" id="toggle-snap" checked> Snapping</label>
            <button id="btn-export">Export</button>
            <button id="btn-import">Import</button>
        </div>
    </div>

    <div id="preview-ui" class="hidden">
        <div id="preview-stats">Radius: -- m | Max Speed: -- km/h | Elevation: 0m</div>
        <button id="btn-confirm-build">Confirm</button>
        <button id="btn-cancel-build">Cancel</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="js/main.js"></script>
</body>
</html>
