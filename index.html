<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Sandbox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="toolbar">
            <button id="btn-tool-pan" class="active">Pan/Zoom</button>
            <button id="btn-tool-build">Build Track</button>
            <button id="btn-tool-platform">Build Platform</button>
            <button id="btn-tool-select">Select</button>
            <button id="btn-tool-multiselect">Multi-Select</button>
            <div class="divider"></div>
            <label><input type="checkbox" id="toggle-snap" checked> Snap</label>
        </div>

        <div id="preview-panel" class="hidden panel">
            <h3>Track Preview</h3>
            <p id="preview-stats">Radius: -- m<br>Max Speed: -- km/h<br>Gradient: --%</p>
            <div class="input-group">
                <label>Height (m):</label>
                <input type="number" id="track-height" value="0" step="0.5">
            </div>
            <button id="btn-confirm-build">Confirm (✔)</button>
            <button id="btn-cancel-build">Cancel (✖)</button>
        </div>

        <div id="data-panel" class="panel">
            <button id="btn-save">Save</button>
            <button id="btn-load">Load</button>
            <button id="btn-export">Export</button>
            <input type="file" id="btn-import" accept=".json" style="display: none;">
            <button onclick="document.getElementById('btn-import').click()">Import</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
