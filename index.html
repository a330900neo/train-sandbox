<div id="toolbar">
    <button id="tool-pan" class="active">Pan/Zoom</button>
    <button id="tool-track">Build Track</button>
    <button id="tool-select">Select</button>
    <div class="divider"></div>
    <label><input type="checkbox" id="toggle-snap" checked> Snapping</label>
    <div class="divider"></div>
    <label>Routing: 
        <select id="route-mode">
            <option value="auto">Auto (Single Arc/Straight)</option>
            <option value="biarc">Biarc (S-Curve)</option>
            <option value="asa">Arc-Straight-Arc</option>
        </select>
    </label>
    <label id="custom-radius-container" class="hidden"> Radius: 
        <input type="number" id="custom-radius" value="500" step="10">
    </label>
    <div class="divider"></div>
    <button id="btn-save">Save</button>
</div>

<div id="build-ui" class="hidden overlay-panel bottom-center">
    <div id="preview-data">Len: 0m | Grad: 0% | Elev: 0m | Rad: 0m | Spd: 0 km/h</div>
    <div class="controls">
        <label>Height: <input type="number" id="height-input" value="0" step="1"></label>
        <button id="btn-confirm" class="primary">Confirm Placement</button>
        <button id="btn-cancel" class="danger">Cancel</button>
    </div>
</div>
