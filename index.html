<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-top">
        <div class="toolbar">
            <button id="btn-pan" class="active">Pan/Zoom</button>
            <button id="btn-build-track">Build Track</button>
            <button id="btn-build-plat">Build Platform</button>
            <button id="btn-select">Select</button>
            <button id="btn-multi">Multi-Select</button>
            <button id="btn-delete" class="danger">Delete Selected</button>
        </div>
        <div class="toolbar">
            <label><input type="checkbox" id="toggle-snap" checked> Snap (1.5m)</label>
            <label>Elev (m): <input type="number" id="input-elevation" value="0" step="1" style="width: 50px;"></label>
            <button id="btn-export">Export</button>
            <button id="btn-import">Import</button>
        </div>
    </div>

    <div id="preview-ui" class="hidden">
        <div id="preview-stats">Length: --m | Elev: --m | Gradient: --% | Radius: --m | Clearance: --m</div>
        <div id="dubins-controls" class="hidden" style="margin: 10px 0;">
            <button id="btn-dubins-down" style="padding: 5px 15px; font-weight: bold;">- Radius</button>
            <span id="dubins-radius-val" style="color: white; margin: 0 10px;">200m</span>
            <button id="btn-dubins-up" style="padding: 5px 15px; font-weight: bold;">+ Radius</button>
        </div>
        <button id="btn-confirm-build">Confirm</button>
        <button id="btn-cancel-build">Cancel</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="js/main.js"></script>
</body>
</html>
