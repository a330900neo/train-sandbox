<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Railway Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div class="panel">
            <h3>Tools</h3>
            <button id="btn-select" class="active">Select / Pan</button>
            <button id="btn-build">Build Track</button>
            <hr>
            <label>Layer: <input type="number" id="input-layer" value="1" min="1" max="5" style="width: 40px;"></label>
            <br>
            <label>Parallel Snap (m): <input type="number" id="input-parallel" value="4.0" step="0.1" style="width: 50px;"></label>
        </div>
        
        <div id="preview-info" class="panel hidden">
            <h3>Preview Info</h3>
            <p>Length: <span id="info-length">0</span> m</p>
            <p>Radius: <span id="info-radius">Straight</span></p>
            <p>Max Speed: <span id="info-speed">160</span> km/h</p>
            <button id="btn-confirm">Confirm Track</button>
            <button id="btn-flip">Flip Direction</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="js/main.js"></script>
</body>
</html>
