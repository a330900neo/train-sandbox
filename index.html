<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Track Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="toolbar">
        <button id="tool-pan" class="active">Pan/Zoom</button>
        <button id="tool-build">Build Track</button>
        <button id="tool-select">Select</button>
        <button id="tool-multi">Multi-Select</button>
        <div class="separator"></div>
        <label><input type="checkbox" id="toggle-snap" checked> Snap</label>
        <label>Z (Height): <input type="number" id="current-z" value="0" step="1"></label>
        <label>Parallel Dist: <input type="number" id="parallel-dist" value="3.5" step="0.1" min="3.5" max="4.0">m</label>
        <div class="separator"></div>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
        <button id="btn-export">Export</button>
        <button id="btn-import-btn">Import</button>
        <input type="file" id="btn-import" accept=".json" style="display:none;">
    </div>

    <div id="preview-menu" class="hidden floating-menu">
        <p id="preview-stats">Preview Data</p>
        <button id="btn-confirm-build">Confirm (✔)</button>
        <button id="btn-cancel-build">Cancel (X)</button>
    </div>

    <div id="dubins-menu" class="hidden floating-menu">
        <h4>Complex Connection</h4>
        <button id="btn-flip-start">Flip Start Direction</button>
        <button id="btn-flip-end">Flip End Direction</button>
        <label>Radius (m): <input type="number" id="dubins-radius" value="100"></label>
        <button id="btn-apply-dubins">Apply Curve</button>
    </div>

    <div id="select-menu" class="hidden floating-menu">
        <p id="select-data">Track Data</p>
        <button id="btn-delete-track">Delete</button>
        <button id="btn-turn-around" class="hidden">Turn Around</button>
        <button id="btn-force-one" class="hidden">Force Single Train</button>
    </div>

    <script src="math.js"></script>
    <script src="loadsavedata.js"></script>
    <script src="track.js"></script>
    <script src="render.js"></script>
</body>
</html>
