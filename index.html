<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Track Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-container">
        <div id="toolbar">
            <button onclick="setTool('pan')">Pan/Zoom</button>
            <button onclick="setTool('build_track')">Build Track</button>
            <button onclick="setTool('build_platform')">Build Platform</button>
            <button onclick="setTool('select')">Select Tool</button>
            <button onclick="setTool('multi_select')">Multi-Select</button>
            <div class="separator"></div>
            <label>Height: <input type="number" id="height-input" value="0" step="1"></label>
            <label><input type="checkbox" id="snap-toggle" checked> Snap (1.5m)</label>
            <label>Parallel Dist: <input type="number" id="parallel-dist" value="3.8" step="0.1"></label>
            <div class="separator"></div>
            <button onclick="exportData()">Export</button>
            <input type="file" id="import-file" style="display:none" onchange="importData(event)">
            <button onclick="document.getElementById('import-file').click()">Import</button>
        </div>

        <div id="preview-menu" class="hidden floating-panel">
            <h3>Preview Track</h3>
            <div id="preview-stats"></div>
            <button onclick="confirmPreview()">Confirm</button>
            <button onclick="cancelPreview()">Cancel</button>
        </div>

        <div id="dubins-menu" class="hidden floating-panel">
            <h3>Dubins Connection</h3>
            <label>Radius (m): <input type="number" id="dubins-radius" value="100"></label>
            <button onclick="flipDubinsStart()">Flip Start Dir</button>
            <button onclick="flipDubinsEnd()">Flip End Dir</button>
            <button onclick="applyDubins()">Apply</button>
        </div>

        <div id="select-menu" class="hidden floating-panel">
            <h3>Track Info</h3>
            <div id="select-stats"></div>
            <button onclick="deleteSelected()">Delete Track</button>
            <button onclick="closeMenus()">Close</button>
        </div>

        <div id="multi-select-menu" class="hidden floating-panel">
            <h3>Multi-Select</h3>
            <button onclick="turnAroundSelected()">Turn Around</button>
            <button onclick="forceSingleTrain()">Force Single Train</button>
            <button onclick="closeMenus()">Close</button>
        </div>
    </div>

    <script src="math.js"></script>
    <script src="track.js"></script>
    <script src="render.js"></script>
    <script src="loadsavedata.js"></script>
    <script>
        // Init logic
        const canvas = document.getElementById('gameCanvas');
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Start engine
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
