<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Train Builder Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="toolbar">
        <button id="tool-pan" class="active">Pan/Zoom</button>
        <button id="tool-track">Build Track</button>
        <button id="tool-platform">Build Platform</button>
        <button id="tool-select">Select</button>
        <button id="tool-multiselect">Multi-Select</button>
        <div class="divider"></div>
        <label><input type="checkbox" id="toggle-snap" checked> Snap</label>
        <div class="divider"></div>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
    </div>

    <div id="build-ui" class="hidden overlay-panel bottom-center">
        <div id="preview-data">Len: 0m | Grad: 0% | Elev: 0m | Rad: 0m | Max: 0 km/h</div>
        <div class="controls">
            <label>Mode: 
                <select id="conn-mode">
                    <option value="auto">Auto (Single Arc)</option>
                    <option value="biarc">Biarc (Two Arcs)</option>
                    <option value="arclinearc">Arc-Line-Arc</option>
                </select>
            </label>
            <label id="radius-container" class="hidden">Rad: <input type="number" id="conn-radius" value="500" step="50"></label>
            <label>H: <input type="number" id="height-input" value="0" step="1"></label>
            <button id="btn-confirm" class="primary">Confirm</button>
            <button id="btn-cancel" class="danger">Cancel</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
