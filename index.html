<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Railway Builder Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="map"></div>

    <div id="toolbar">
        <button id="btn-build" class="active">Build Track</button>
        <button id="btn-select">Select Tool</button>
        <div class="control-group">
            <label>Layer:</label>
            <input type="number" id="layer-input" value="1" min="1" max="5">
        </div>
        <div class="control-group">
            <label>Snap Offset (m):</label>
            <input type="number" id="snap-offset" value="3.5" step="0.1">
        </div>
    </div>

    <div id="preview-panel" class="hidden">
        <h3>Track Preview</h3>
        <p>Length: <span id="info-length">0</span> m</p>
        <p>Radius: <span id="info-radius">Straight</span></p>
        <p>Max Speed: <span id="info-speed">160</span> km/h</p>
        <button id="btn-confirm" class="action-btn">Confirm Track</button>
        <button id="btn-cancel" class="action-btn cancel">Cancel</button>
    </div>

    <div id="properties-panel" class="hidden">
        <h3>Track Properties</h3>
        <label>Speed Limit (km/h): <input type="number" id="prop-speed"></label>
        <label><input type="checkbox" id="prop-oneway"> One Way</label>
        <label><input type="checkbox" id="prop-turnback"> Turnback Track</label>
        <label>Platform: 
            <select id="prop-platform">
                <option value="none">None</option>
                <option value="both">Both Sides</option>
                <option value="left">Left Only</option>
                <option value="right">Right Only</option>
            </select>
        </label>
        <label>Platform Width (m): <input type="number" id="prop-plat-width" value="3"></label>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/turf@3.0.14/turf.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
